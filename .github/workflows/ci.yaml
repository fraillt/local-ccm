name: ci

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:

env:
  IMAGE_REPOSITORY: ghcr.io/fraillt/local-ccm

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Run Go tests
        run: go test ./...

      - name: Build Go binaries
        run: go build ./...

      - name: Lint Helm chart
        run: helm lint charts/local-ccm

  build-image:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute image version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            {
              echo "value=${GITHUB_REF_NAME}"
              echo "publish=true"
              echo "platforms=linux/amd64,linux/arm64"
            } >> "${GITHUB_OUTPUT}"
          else
            {
              echo "value=sha-${GITHUB_SHA::7}"
              echo "publish=false"
              echo "platforms=linux/amd64"
            } >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.version.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ steps.version.outputs.platforms }}
          push: ${{ steps.version.outputs.publish == 'true' }}
          provenance: false
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-manifests:
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Compute manifest version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            {
              echo "value=${GITHUB_REF_NAME}"
            } >> "${GITHUB_OUTPUT}"
          else
            {
              echo "value=sha-${GITHUB_SHA::7}"
            } >> "${GITHUB_OUTPUT}"
          fi

      - name: Generate versioned manifests
        shell: bash
        run: |
          set -euo pipefail

          workdir="$(mktemp -d)"
          artifacts_dir="${RUNNER_TEMP}/local-ccm-artifacts"
          rm -rf "${artifacts_dir}"
          mkdir -p "${artifacts_dir}"

          cp -R deploy "${workdir}/deploy"
          cp -R charts/local-ccm "${workdir}/chart"

          while IFS= read -r -d '' file; do
            sed -i "s|{GIT_TAG_VERSION}|${{ steps.version.outputs.value }}|g" "${file}"
          done < <(find "${workdir}/deploy" "${workdir}/chart" -type f \( -name '*.yaml' -o -name 'Chart.yaml' -o -name 'README.md' \) -print0)

          cat \
            "${workdir}/deploy/rbac.yaml" \
            "${workdir}/deploy/daemonset.yaml" \
            "${workdir}/deploy/nlc-rbac.yaml" \
            "${workdir}/deploy/nlc-deployment.yaml" \
            > "${artifacts_dir}/local-ccm-static.yaml"

          helm template local-ccm "${workdir}/chart" --namespace kube-system > "${artifacts_dir}/local-ccm-helm.yaml"
          helm package "${workdir}/chart" --destination "${artifacts_dir}"

          sha256sum "${artifacts_dir}"/* > "${artifacts_dir}/SHA256SUMS"

      - name: Upload manifest artifacts
        uses: actions/upload-artifact@v4
        with:
          name: manifests-${{ steps.version.outputs.value }}
          path: ${{ runner.temp }}/local-ccm-artifacts
