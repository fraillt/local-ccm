name: CI
run-name: ${{ github.event_name }} / ${{ github.ref_name }}

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/local-ccm
  CHART_REPOSITORY: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  # Validate the repository on every event. This also verifies that the Docker
  # image builds successfully without publishing anything.
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate repository
        run: |
          make validate \
            CACHE_FROM=type=gha \
            CACHE_TO=type=gha,mode=max

  # Tag pushes publish the container image, Helm chart, and GitHub Release
  # assets from one runner so the release path stays linear and easy to follow.
  publish-artifacts:
    name: Publish artifacts
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "version=${version}"
            echo "build_dir=${RUNNER_TEMP}/local-ccm-release"
          } >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        run: |
          make image-push \
            TAG="${{ steps.release.outputs.version }}" \
            IMAGE_REPOSITORY="${{ env.IMAGE_REPOSITORY }}" \
            PUSH_PLATFORMS=linux/amd64,linux/arm64 \
            CACHE_FROM=type=gha \
            CACHE_TO=type=gha,mode=max

      - name: Publish Helm chart and collect release manifests
        shell: bash
        run: |
          set -euo pipefail

          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
          make chart-push release-artifacts \
            RELEASE_VERSION="${{ steps.release.outputs.version }}" \
            REPOSITORY_OWNER="${{ github.repository_owner }}" \
            BUILD_DIR="${{ steps.release.outputs.build_dir }}" \
            CHART_REPOSITORY="${{ env.CHART_REPOSITORY }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.release.outputs.version }}
          generate_release_notes: true
          files: |
            ${{ steps.release.outputs.build_dir }}/artifacts/local-ccm.yaml
            ${{ steps.release.outputs.build_dir }}/artifacts/node-lifecycle-controller.yaml
