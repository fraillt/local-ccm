name: CI
run-name: ${{ github.event_name }} / ${{ github.ref_name }}

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/local-ccm

jobs:
  # Validate the repository on every event. This also verifies that the Docker
  # image builds successfully without publishing anything.
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run Go tests
        run: go test ./...

      - name: Build Go binaries
        run: go build ./...

      - name: Lint Helm chart
        run: helm lint templates/charts/local-ccm

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: local-ccm:validate
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Tag pushes publish the container image, Helm chart, and GitHub Release
  # assets from one runner so the release path stays linear and easy to follow.
  publish-artifacts:
    name: Publish artifacts
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "version=${version}"
            echo "platforms=linux/amd64,linux/arm64"
            echo "workdir=${RUNNER_TEMP}/release-workdir"
            echo "artifacts_dir=${RUNNER_TEMP}/local-ccm-artifacts"
          } >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ steps.release.outputs.platforms }}
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ steps.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Render versioned templates
        shell: bash
        run: |
          set -euo pipefail

          workdir="${{ steps.release.outputs.workdir }}"
          rm -rf "${workdir}"
          mkdir -p "${workdir}"
          cp -R templates "${workdir}"

          while IFS= read -r -d '' file; do
            sed -i \
              -e "s|{REPLACE_VERSION}|${{ steps.release.outputs.version }}|g" \
              -e "s|{REPLACE_OWNER}|${{ github.repository_owner }}|g" \
              "${file}"
          done < <(find "${workdir}/templates" -type f -name '*.yaml' -print0)

      - name: Publish Helm chart
        shell: bash
        run: |
          set -euo pipefail

          workdir="${{ steps.release.outputs.workdir }}"
          package_dir="${workdir}/helm-package"
          rm -rf "${package_dir}"
          mkdir -p "${package_dir}"

          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
          helm package \
            "${workdir}/templates/charts/local-ccm" \
            --destination "${package_dir}" \
            --version "${{ steps.release.outputs.version }}"
          helm push "${package_dir}/local-ccm-${{ steps.release.outputs.version }}.tgz" oci://ghcr.io/${{ github.repository_owner }}/charts

      - name: Collect static manifests
        shell: bash
        run: |
          set -euo pipefail

          workdir="${{ steps.release.outputs.workdir }}"
          artifacts_dir="${{ steps.release.outputs.artifacts_dir }}"
          rm -rf "${artifacts_dir}"
          mkdir -p "${artifacts_dir}"

          cp "${workdir}/templates/static/local-ccm.yaml" "${artifacts_dir}/local-ccm.yaml"
          cp "${workdir}/templates/static/node-lifecycle-controller.yaml" "${artifacts_dir}/node-lifecycle-controller.yaml"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.release.outputs.version }}
          generate_release_notes: true
          files: |
            ${{ steps.release.outputs.artifacts_dir }}/local-ccm.yaml
            ${{ steps.release.outputs.artifacts_dir }}/node-lifecycle-controller.yaml
