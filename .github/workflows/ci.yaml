name: ci

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_REPOSITORY: ghcr.io/fraillt/local-ccm

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Run Go tests
        run: go test ./...

      - name: Build Go binaries
        run: go build ./...

      - name: Lint Helm chart
        run: helm lint charts/local-ccm

  prepare-release-metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      publish: ${{ steps.version.outputs.publish }}
      platforms: ${{ steps.version.outputs.platforms }}

    steps:
      - name: Compute build metadata
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            {
              echo "value=${GITHUB_REF_NAME}"
              echo "publish=true"
              echo "platforms=linux/amd64,linux/arm64"
            } >> "${GITHUB_OUTPUT}"
          else
            {
              echo "value=sha-${GITHUB_SHA::7}"
              echo "publish=false"
              echo "platforms=linux/amd64"
            } >> "${GITHUB_OUTPUT}"
          fi

  build-image:
    needs:
      - validate
      - prepare-release-metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: needs.prepare-release-metadata.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ needs.prepare-release-metadata.outputs.platforms }}
          push: ${{ needs.prepare-release-metadata.outputs.publish == 'true' }}
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ needs.prepare-release-metadata.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-manifests:
    if: github.event_name != 'pull_request'
    needs:
      - validate
      - prepare-release-metadata
      - build-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Generate versioned manifests
        shell: bash
        run: |
          set -euo pipefail

          workdir="$(mktemp -d)"
          trap 'rm -rf "${workdir}"' EXIT
          artifacts_dir="${RUNNER_TEMP}/local-ccm-artifacts"
          rm -rf "${artifacts_dir}"
          mkdir -p "${artifacts_dir}"

          cp -R deploy "${workdir}/deploy"
          cp -R charts/local-ccm "${workdir}/chart"

          expected_files=(
            "deploy/daemonset.yaml"
            "deploy/nlc-deployment.yaml"
            "chart/Chart.yaml"
            "chart/values.yaml"
          )

          for file in "${expected_files[@]}"; do
            if ! grep -q '{GIT_TAG_VERSION}' "${workdir}/${file}"; then
              echo "Missing {GIT_TAG_VERSION} placeholder in ${workdir}/${file}"
              exit 1
            fi
          done

          while IFS= read -r -d '' file; do
            sed -i "s|{GIT_TAG_VERSION}|${{ needs.prepare-release-metadata.outputs.version }}|g" "${file}"
          done < <(find "${workdir}/deploy" "${workdir}/chart" -type f -name '*.yaml' -print0)

          if find "${workdir}/deploy" "${workdir}/chart" -type f -name '*.yaml' -exec grep -nH '{GIT_TAG_VERSION}' {} +; then
            echo "Unreplaced {GIT_TAG_VERSION} placeholders remain in generated artifacts"
            exit 1
          fi

          cat \
            "${workdir}/deploy/rbac.yaml" \
            "${workdir}/deploy/daemonset.yaml" \
            > "${artifacts_dir}/local-ccm.yaml"

          cat \
            "${workdir}/deploy/nlc-rbac.yaml" \
            "${workdir}/deploy/nlc-deployment.yaml" \
            > "${artifacts_dir}/node-lifecycle-controller"

          if [[ "${{ needs.prepare-release-metadata.outputs.publish }}" == "true" ]]; then
            echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
            helm package "${workdir}/chart" --destination "${workdir}"
            helm push "${workdir}/local-ccm-${{ needs.prepare-release-metadata.outputs.version }}.tgz" oci://ghcr.io/fraillt
          fi

      - name: Upload manifest artifacts
        uses: actions/upload-artifact@v4
        with:
          name: manifests-${{ needs.prepare-release-metadata.outputs.version }}
          path: ${{ runner.temp }}/local-ccm-artifacts

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - publish-manifests
      - prepare-release-metadata
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download manifest artifacts
        uses: actions/download-artifact@v4.1.3
        with:
          name: manifests-${{ needs.prepare-release-metadata.outputs.version }}
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
