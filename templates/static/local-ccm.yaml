---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: local-ccm
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: system:local-ccm
rules:
# Permissions to get and update nodes
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch", "patch"]
# Permissions to update node status (for addresses)
- apiGroups: [""]
  resources: ["nodes/status"]
  verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: system:local-ccm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:local-ccm
subjects:
- kind: ServiceAccount
  name: local-ccm
  namespace: kube-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: local-ccm
  namespace: kube-system
  labels:
    app: local-ccm
    component: node-controller
spec:
  selector:
    matchLabels:
      app: local-ccm
  template:
    metadata:
      labels:
        app: local-ccm
        component: node-controller
    spec:
      serviceAccountName: local-ccm
      hostNetwork: true # Required to access host network interfaces
      dnsPolicy: ClusterFirstWithHostNet
      # Tolerate all taints to run on every node
      tolerations:
        - operator: Exists
      # Prefer to schedule on nodes needing initialization first
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node.cloudprovider.kubernetes.io/uninitialized
                    operator: Exists
      containers:
        - name: local-ccm
          image: ghcr.io/{REPLACE_OWNER}/local-ccm:{REPLACE_VERSION}
          imagePullPolicy: Always
          command:
            - /usr/local/bin/local-ccm
          args:
            - --node-name=$(NODE_NAME)
            - --external-ip-target=8.8.8.8
            # - --internal-ip-target=10.0.0.1  # Uncomment and set to enable internal IP detection
            - --remove-taint=true
            - --reconcile-interval=10s
            - --v=2
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            capabilities:
              add:
                - NET_ADMIN # Required for netlink route queries
                - NET_RAW
            runAsUser: 0 # Must run as root to access netlink
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
